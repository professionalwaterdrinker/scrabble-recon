name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # redeploy after the engine is rebuilt, so the site always carries the newest engine
  workflow_run:
    workflows: ['Build Quackle engine']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # after an engine build, only deploy if it succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The Quackle engine is built by quackle.yml into the quackle-build branch.
      - name: Add the Quackle engine build
        run: |
          if git ls-remote --exit-code origin quackle-build > /dev/null; then
            git fetch -q --depth 1 origin quackle-build
            mkdir -p engine
            git archive FETCH_HEAD | tar -x -C engine
            rm -f engine/README.md
            ls -l engine
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
